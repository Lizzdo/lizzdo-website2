<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LIZZDO - Premier 3D modeling, game development, and digital experiences." />
    <meta name="keywords" content="3D modeling, game development, Roblox, Unity, Unreal Engine, Web Development, SEO" />
    <meta name="author" content="LIZZDO" />
    <!-- Favicon configurations -->
    
    
    
    
    <!--ssr-head-->
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#000000">
    <meta name="msapplication-TileColor" content="#000000">
    <meta name="msapplication-TileImage" content="/android-chrome-192x192.png">
    <title>LIZZDO | 3D & Digital Experiences</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>
  <body class="bg-black text-white antialiased">
    <div id="root"><!--ssr-outlet--></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", user => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.href = "/admin/";
            });
          }
        });
      }
    </script>
  </body>
</html>
